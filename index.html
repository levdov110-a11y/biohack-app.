<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
    <title>BioHack Studio - Unified Pro</title>
    <style>
        :root {
            --bg: #08131f; --card: #152a3f; --accent: #03dac6; 
            --accent2: #e94560; --text: #f0f4f8; --success: #4caf50;
        }
        body { margin: 0; font-family: 'Segoe UI', system-ui; background: var(--bg); color: var(--text); padding-bottom: 90px; overflow-x: hidden; }
        
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; justify-content: space-around; padding: 12px 0; border-top: 2px solid var(--accent); z-index: 1000; }
        .nav-item { cursor: pointer; text-align: center; font-size: 0.8rem; flex: 1; opacity: 0.6; transition: 0.3s; }
        .nav-item.active { opacity: 1; color: var(--accent); }

        .page { display: none; padding: 20px; max-width: 600px; margin: auto; animation: fadeIn 0.3s; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: var(--card); border-radius: 15px; padding: 20px; margin-bottom: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); }
        h2 { border-bottom: 1px solid var(--accent); padding-bottom: 8px; margin-top: 0; font-size: 1.1rem; display: flex; justify-content: space-between; align-items: center; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        button { border: none; border-radius: 8px; padding: 10px; cursor: pointer; background: #2a415a; color: white; font-weight: bold; transition: 0.2s; }
        .btn-main { background: var(--accent); color: #000; width: 100%; }
        .btn-danger { background: var(--accent2); padding: 5px 10px; font-size: 0.8rem; }
        
        input, textarea, select { width: 100%; padding: 12px; background: #0d1a2b; color: white; border: 1px solid #2a415a; border-radius: 8px; box-sizing: border-box; margin-bottom: 10px; }
        
        .list-item { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-right: 4px solid var(--accent); position: relative; }
        .timer-val { color: var(--accent2); font-weight: bold; font-family: monospace; }

        #breathOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 2000; flex-direction: column; justify-content: center; align-items: center; }
        .b-circle { width: 120px; height: 120px; border-radius: 50%; background: var(--accent); opacity: 0.4; box-shadow: 0 0 60px var(--accent); transition: transform 4s ease-in-out; }
        .b-grow { transform: scale(2.5); }

        .progress-bar { background: #000; height: 10px; border-radius: 5px; margin: 10px 0; overflow: hidden; }
        .progress-fill { background: var(--success); height: 100%; width: 0%; transition: 0.5s; }

        /* נגן שמע בעיצוב המקורי */
        .player-tools { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 8px; }
        .loop-btn { font-size: 0.7rem; padding: 5px; opacity: 0.5; }
        .loop-btn.active { opacity: 1; border: 1px solid var(--accent); color: var(--accent); }
    </style>
</head>
<body>

    <div id="breathOverlay">
        <div class="b-circle" id="mainBreathCircle"></div>
        <button onclick="closeBreath()" style="margin-top: 60px; background:transparent; border:1px solid white;">חזור לתפריט</button>
    </div>

    <div id="home" class="page active">
        <div class="card" style="text-align: center;">
            <h1 style="color: var(--accent); margin:0;">BioHack Studio</h1>
            <canvas id="viz" style="width:100%; height:80px;"></canvas>
            <div id="status" style="font-size: 0.8rem; margin: 10px 0;">מוכן</div>
            <button class="btn-main" onclick="toggleMainAudio()" id="playBtn">הפעל תדר בסיס</button>
            
            <div style="margin-top:15px; text-align: right;">
                <label style="font-size: 0.8rem;">בחר קובץ/תיקייה לשמע:</label>
                <input type="file" id="bgMusic" accept="audio/*" multiple onchange="handleMusicFiles(event)">
                <div id="trackDisplay" style="font-size: 0.7rem; color: var(--accent); margin: 3px 0;">אין קובץ נבחר</div>
                
                <div class="player-tools">
                    <button onclick="prevT()" style="background:none">⏮️</button>
                    <button id="lp1" class="loop-btn" onclick="toggleLoop('one')">🔂 חוזר 1</button>
                    <button id="lpAll" class="loop-btn" onclick="toggleLoop('all')">🔁 חוזר הכל</button>
                    <button onclick="nextT()" style="background:none">⏭️</button>
                </div>
            </div>
            
            <button onclick="openBreath()" style="margin-top:15px; width:100%; background:none; border:1px solid var(--accent); color:var(--accent);">מצב נשימה חזותי (עיגול)</button>
        </div>

        <div class="card">
            <h2>משימות והתקדמות</h2>
            <div class="progress-bar"><div id="pFill" class="progress-fill"></div></div>
            <div id="pText" style="font-size: 0.8rem;">0/0 הושלמו</div>
        </div>
    </div>

    <div id="cats" class="page">
        <h2>📂 קטגוריות <button onclick="addCustomCat()" style="font-size:0.7rem">+ הוסף</button></h2>
        <div class="grid" id="catGrid"></div>
        <h2 style="margin-top:20px">〰️ סוגי גלים</h2>
        <div class="grid" id="waveGrid"></div>
    </div>

    <div id="reminders" class="page">
        <h2>🔔 תזכורות, טיימרים והקלטות</h2>
        <div class="card">
            <input type="text" id="tTitle" placeholder="שם (למשל: בדיקת מציאות)">
            <input type="text" id="tTimes" placeholder="שעות (08:00, 16:00) או דקות לטיימר">
            <button id="recRemBtn" onclick="toggleRemRec()">🎤 הקלט הנחיה קולית</button>
            <button class="btn-main" onclick="addReminder()" style="margin-top:10px">שמור תזכורת</button>
        </div>
        <div id="reminderList"></div>
    </div>

    <div id="journal" class="page">
        <h2>📓 יומן חלומות חכם</h2>
        <div class="card">
            <input type="date" id="dreamDate">
            <textarea id="dreamText" placeholder="תאר את החלום..."></textarea>
            <div class="grid">
                <button onclick="toggleJournalRec()" id="jouRecBtn">🎤 הקלטה</button>
                <button onclick="saveDream()" class="btn-main">💾 שמור חלום</button>
            </div>
            <div id="jouPreview" style="margin-top:10px"></div>
        </div>
        <div id="dreamList"></div>
    </div>

    <div id="settings" class="page">
        <h2>⚙️ הגדרות</h2>
        <div class="card">
            <p style="font-size: 0.9rem; margin-bottom: 5px;"><strong>יוצר:</strong> דובי לוי</p>
            <p style="font-size: 0.9rem; margin-top: 0;"><strong>עבור:</strong> נחמן גלנט</p>
            <hr>
            <label>צבע ממשק</label>
            <input type="color" id="themeColor" value="#03dac6" onchange="changeTheme(this.value)">
            <hr>
            <label>טיימר כיבוי כללי (דקות)</label>
            <input type="number" id="globalSleep" placeholder="60">
            <button class="btn-main" onclick="setGlobalSleep()">הפעל טיימר שינה</button>
            <button class="btn-danger" style="width:100%; margin-top:15px" onclick="clearData()">מחק את כל המידע</button>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="nav('home')">🏠<br>בית</div>
        <div class="nav-item" onclick="nav('cats')">📂<br>תדרים</div>
        <div class="nav-item" onclick="nav('reminders')">🔔<br>תזכורות</div>
        <div class="nav-item" onclick="nav('journal')">📓<br>יומן</div>
        <div class="nav-item" onclick="nav('settings')">⚙️<br>הגדרות</div>
    </div>

<script>
    let ctx, gain, oscL, oscR, isPlaying = false;
    let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
    let dreams = JSON.parse(localStorage.getItem('dreams')) || [];
    let mediaRec, audioChunks = [], currentRecUrl = null;
    let currentWave = 'sine';
    
    // נגן מוזיקה משופר
    let playlist = [], currentTrackIdx = 0, loopState = 'none'; // 'none', 'one', 'all'
    let bgAudio = new Audio();

    const $ = id => document.getElementById(id);

    function initCtx() { if(!ctx) { ctx = new AudioContext(); gain = ctx.createGain(); gain.connect(ctx.destination); } }

    function nav(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        $(id).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // --- מערכת השמעה ---
    function handleMusicFiles(e) {
        playlist = Array.from(e.target.files);
        if(playlist.length > 0) playTrack(0);
    }

    function playTrack(idx) {
        if(!playlist[idx]) return;
        currentTrackIdx = idx;
        bgAudio.src = URL.createObjectURL(playlist[idx]);
        bgAudio.play();
        $('trackDisplay').textContent = "מנגן: " + playlist[idx].name;
    }

    function nextT() {
        currentTrackIdx++;
        if(currentTrackIdx >= playlist.length) currentTrackIdx = (loopState === 'all' ? 0 : playlist.length - 1);
        playTrack(currentTrackIdx);
    }

    function prevT() {
        currentTrackIdx--;
        if(currentTrackIdx < 0) currentTrackIdx = 0;
        playTrack(currentTrackIdx);
    }

    function toggleLoop(mode) {
        if(loopState === mode) loopState = 'none';
        else loopState = mode;
        $('lp1').classList.toggle('active', loopState === 'one');
        $('lpAll').classList.toggle('active', loopState === 'all');
    }

    bgAudio.onended = () => {
        if(loopState === 'one') bgAudio.play();
        else if(loopState === 'all' || currentTrackIdx < playlist.length - 1) nextT();
    };

    // --- תדרים (המקורי שלך) ---
    function toggleMainAudio() {
        initCtx();
        if(isPlaying) { stopAll(); }
        else { startTones(136.1, 7.83); }
    }

    function startTones(base, beat) {
        initCtx();
        if(isPlaying) stopAll();
        oscL = ctx.createOscillator(); oscR = ctx.createOscillator();
        let pL = ctx.createStereoPanner(), pR = ctx.createStereoPanner();
        oscL.type = oscR.type = currentWave;
        oscL.frequency.value = base - (beat/2); oscR.frequency.value = base + (beat/2);
        pL.pan.value = -1; pR.pan.value = 1;
        oscL.connect(pL).connect(gain); oscR.connect(pR).connect(gain);
        oscL.start(); oscR.start(); isPlaying = true;
        $('playBtn').textContent = "עצור סשן";
        $('status').textContent = `מתנגן: ${base}Hz + ${beat}Hz`;
    }

    function stopAll() {
        if(oscL) { oscL.stop(); oscR.stop(); }
        isPlaying = false;
        $('playBtn').textContent = "הפעל תדר בסיס";
        $('status').textContent = "מוכן";
    }

    // --- שמירה בזיכרון ---
    function saveAll() {
        localStorage.setItem('tasks', JSON.stringify(tasks));
        localStorage.setItem('dreams', JSON.stringify(dreams));
        renderTasks(); renderDreams();
    }

    function addReminder() {
        let t = $('tTitle').value, h = $('tTimes').value;
        if(!t) return;
        let task = { id: Date.now(), title: t, timeInfo: h, audio: currentRecUrl, done: false, timeLeft: isNaN(h) ? null : h*60 };
        tasks.push(task);
        if(task.timeLeft) runTaskTimer(task);
        $('tTitle').value = ''; currentRecUrl = null;
        saveAll();
    }

    function runTaskTimer(task) {
        let timer = setInterval(() => {
            if(task.timeLeft > 0) { task.timeLeft--; renderTasks(); }
            else { clearInterval(timer); alert("זמן נגמר: " + task.title); }
        }, 1000);
    }

    function renderTasks() {
        $('reminderList').innerHTML = tasks.map(t => `
            <div class="list-item">
                <input type="checkbox" ${t.done?'checked':''} onclick="toggleTask(${t.id})">
                <strong>${t.title}</strong><br>
                <small>${t.timeInfo}</small>
                ${t.timeLeft !== null ? `<div class="timer-val">נותר: ${Math.floor(t.timeLeft/60)}:${(t.timeLeft%60).toString().padStart(2,'0')}</div>` : ''}
                ${t.audio ? `<audio src="${t.audio}" controls style="width:100%; margin-top:5px;"></audio>` : ''}
                <button class="btn-danger" onclick="tasks=tasks.filter(x=>x.id!=${t.id});saveAll();">🗑️</button>
            </div>`).join('');
        updateProgress();
    }

    function saveDream() {
        let txt = $('dreamText').value, date = $('dreamDate').value;
        if(!txt) return;
        dreams.unshift({ id: Date.now(), text: txt, date, audio: currentRecUrl });
        $('dreamText').value = ""; currentRecUrl = null;
        saveAll();
    }

    function renderDreams() {
        $('dreamList').innerHTML = dreams.map(d => `
            <div class="list-item">
                <small>${d.date}</small>
                <p contenteditable="true" onblur="dreams.find(x=>x.id==${d.id}).text=this.innerText;saveAll()">${d.text}</p>
                ${d.audio ? `<audio src="${d.audio}" controls style="width:100%"></audio>` : ''}
                <button class="btn-danger" onclick="dreams=dreams.filter(x=>x.id!=${d.id});saveAll();">🗑️ מחיקה</button>
            </div>`).join('');
    }

    function toggleTask(id) { let t = tasks.find(x=>x.id==id); t.done = !t.done; saveAll(); }
    
    function updateProgress() {
        let done = tasks.filter(x=>x.done).length, total = tasks.length;
        let p = total > 0 ? (done/total)*100 : 0;
        $('pFill').style.width = p + "%"; $('pText').textContent = `${done}/${total} משימות הושלמו`;
    }

    function clearData() { if(confirm("למחוק הכל?")) { localStorage.clear(); location.reload(); } }

    // --- קטגוריות וגלים (המקוריים) ---
    const defaultCats = ["חלום צלול", "הקרנה אסטרלית", "ריכוז עמוק", "מדיטציה", "שינה", "רוגע", "יצירתיות", "אנרגיה", "DNA 528Hz", "פוקוס"];
    defaultCats.forEach(c => {
        let b = document.createElement('button'); b.textContent = c;
        b.onclick = () => { startTones(140, 4.5); nav('home'); };
        $('catGrid').appendChild(b);
    });

    ["sine", "square", "sawtooth", "triangle", "pulse", "soft", "hard", "deep", "high", "low"].forEach(w => {
        let b = document.createElement('button'); b.textContent = w;
        b.onclick = () => { currentWave = (['sine','square','sawtooth','triangle'].includes(w)?w:'sine'); alert("גל שונה ל-"+w); };
        $('waveGrid').appendChild(b);
    });

    // --- הקלטות ---
    async function toggleRemRec() {
        if(!mediaRec || mediaRec.state === "inactive") {
            const s = await navigator.mediaDevices.getUserMedia({audio:true});
            mediaRec = new MediaRecorder(s); audioChunks = [];
            mediaRec.ondataavailable = e => audioChunks.push(e.data);
            mediaRec.onstop = () => { currentRecUrl = URL.createObjectURL(new Blob(audioChunks)); };
            mediaRec.start(); $('recRemBtn').textContent = "🛑 עצור הקלטה";
        } else { mediaRec.stop(); $('recRemBtn').textContent = "🎤 הקלט הנחיה"; }
    }

    // --- אתחול ויזואליזציה ---
    const cvs = $('viz'), c = cvs.getContext('2d');
    function draw() {
        c.fillStyle = 'rgba(8,19,31,0.2)'; c.fillRect(0,0,cvs.width,cvs.height);
        c.strokeStyle = isPlaying ? getComputedStyle(document.documentElement).getPropertyValue('--accent') : '#2a415a';
        c.beginPath();
        for(let i=0; i<cvs.width; i++) c.lineTo(i, 40+Math.sin(i*0.05+Date.now()*0.01)*(isPlaying?25:2));
        c.stroke(); requestAnimationFrame(draw);
    }

    let breathTimer;
    function openBreath() {
        $('breathOverlay').style.display = 'flex';
        breathTimer = setInterval(() => $('mainBreathCircle').classList.toggle('b-grow'), 4000);
    }
    function closeBreath() {
        $('breathOverlay').style.display = 'none';
        clearInterval(breathTimer);
    }

    function changeTheme(clr) { document.documentElement.style.setProperty('--accent', clr); }

    // טעינה ראשונית
    $('dreamDate').valueAsDate = new Date();
    renderTasks(); renderDreams(); draw();
</script>
</body>
</html>
